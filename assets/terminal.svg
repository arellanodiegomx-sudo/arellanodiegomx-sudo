    <text x="56" y="165" font-size="48" font-weight="bold">diego</text>
    <text x="56" y="199" font-size="17" fill="#b7ffc9">computer engineering student // builder of things</text>
    <text x="56" y="239" font-size="16">$ build · break · learn · repeat_</text>
